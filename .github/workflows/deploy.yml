name: Build and publish site

on:
  push:
    branches: [main]
  # Approved comments are static content, so refresh them once an hour.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Require the comment dispatch token
        env:
          PUBLIC_COMMENTS_TOKEN: ${{ secrets.PUBLIC_COMMENTS_TOKEN }}
        run: |
          if [ -z "$PUBLIC_COMMENTS_TOKEN" ]; then
            echo "Add PUBLIC_COMMENTS_TOKEN as a repository Actions secret."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check source
        env:
          PUBLIC_COMMENTS_REPO: Crasnec/blog-comments
        run: npm run check

      - name: Build site
        env:
          PUBLIC_COMMENTS_REPO: Crasnec/blog-comments
          PUBLIC_COMMENTS_TOKEN: ${{ secrets.PUBLIC_COMMENTS_TOKEN }}
        run: npm run build

      - name: Checkout Pages repository
        uses: actions/checkout@v7
        with:
          repository: Crasnec/crasnec.github.io
          ssh-key: ${{ secrets.PAGES_DEPLOY_KEY }}
          path: .pages

      - name: Publish generated files
        run: |
          rsync -a --delete --exclude .git dist/ .pages/
          touch .pages/.nojekyll
          cd .pages
          if [ -z "$(git status --porcelain)" ]; then
            echo "Pages output is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Deploy ${GITHUB_SHA}"
          git push origin main
